<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#21404b"/>
    </marker>
    <marker id="arrowLight" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#45a7aa"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0d3440" flood-opacity=".12"/>
    </filter>
    <style>
      .title{font:800 34px 'Segoe UI',Arial,sans-serif;fill:#102f3b}
      .subtitle{font:500 16px 'Segoe UI',Arial,sans-serif;fill:#668087}
      .section{font:800 23px 'Segoe UI',Arial,sans-serif;fill:#1f55c9;letter-spacing:.4px}
      .left{font:800 19px 'Segoe UI',Arial,sans-serif;fill:#12333e}
      .boxTitle{font:800 19px 'Segoe UI',Arial,sans-serif;fill:#153640}
      .boxText{font:500 14px 'Segoe UI',Arial,sans-serif;fill:#557079}
      .small{font:700 12px 'Segoe UI',Arial,sans-serif;fill:#557079;letter-spacing:1px}
      .tiny{font:500 12px 'Segoe UI',Arial,sans-serif;fill:#6a8388}
      .dark{fill:#123a48}
      .teal{fill:#2bbec6}
      .blue{fill:#3e8ee9}
      .green{fill:#9be65b}
      .orange{fill:#ff9b3d}
      .pink{fill:#f5cbd0}
      .cream{fill:#fff9e9}
      .stroke{stroke:#21404b;stroke-width:2}
      .dash{fill:#fff;stroke:#6c777c;stroke-width:2.5;stroke-dasharray:12 8}
      .line{fill:none;stroke:#21404b;stroke-width:2.5;marker-end:url(#arrow)}
      .lineLight{fill:none;stroke:#45a7aa;stroke-width:2.5;marker-end:url(#arrowLight)}
    </style>
  </defs>

  <rect width="1800" height="1320" fill="#fbfcfc"/>
  <text x="54" y="54" class="title">ARSITEKTUR SISTEM STOCKGUARD</text>
  <text x="54" y="82" class="subtitle">Sistem verifikasi pengambilan barang gudang berbasis Laravel, MySQL, dan kamera checkpoint</text>

  <!-- left layer labels -->
  <rect x="36" y="115" width="225" height="130" rx="5" class="teal"/>
  <text x="148" y="153" text-anchor="middle" class="left">PENGGUNA &amp;</text>
  <text x="148" y="180" text-anchor="middle" class="left">PERANGKAT</text>
  <text x="148" y="210" text-anchor="middle" class="tiny">akses web dan checkpoint</text>

  <rect x="36" y="270" width="225" height="250" rx="5" class="teal"/>
  <text x="148" y="320" text-anchor="middle" class="left">APLIKASI</text>
  <text x="148" y="347" text-anchor="middle" class="left">STOCKGUARD</text>
  <text x="148" y="383" text-anchor="middle" class="tiny">antarmuka dan alur bisnis</text>

  <rect x="36" y="545" width="225" height="205" rx="5" class="teal"/>
  <text x="148" y="596" text-anchor="middle" class="left">LAYANAN</text>
  <text x="148" y="623" text-anchor="middle" class="left">VERIFIKASI</text>
  <text x="148" y="659" text-anchor="middle" class="tiny">scan, vision, review</text>

  <rect x="36" y="775" width="225" height="210" rx="5" class="teal"/>
  <text x="148" y="824" text-anchor="middle" class="left">DATA</text>
  <text x="148" y="851" text-anchor="middle" class="left">DAN BUKTI</text>
  <text x="148" y="887" text-anchor="middle" class="tiny">database dan file privat</text>

  <rect x="36" y="1010" width="225" height="220" rx="5" class="teal"/>
  <text x="148" y="1060" text-anchor="middle" class="left">INFRASTRUKTUR</text>
  <text x="148" y="1095" text-anchor="middle" class="tiny">server lokal / deployment</text>

  <!-- layer 1 -->
  <rect x="295" y="115" width="1465" height="130" rx="20" class="dash"/>
  <text x="1027" y="151" text-anchor="middle" class="section">Pengguna &amp; Perangkat Akses</text>
  <rect x="395" y="173" width="300" height="48" rx="10" fill="#e5f8f5" class="stroke"/>
  <text x="545" y="203" text-anchor="middle" class="boxTitle">Staff · Browser / HP</text>
  <rect x="760" y="173" width="330" height="48" rx="10" fill="#e5f8f5" class="stroke"/>
  <text x="925" y="203" text-anchor="middle" class="boxTitle">Supervisor · Browser / Laptop</text>
  <rect x="1155" y="173" width="330" height="48" rx="10" fill="#e5f8f5" class="stroke"/>
  <text x="1320" y="203" text-anchor="middle" class="boxTitle">Admin · Browser / Laptop</text>
  <rect x="1550" y="173" width="130" height="48" rx="10" fill="#fff2dc" class="stroke"/>
  <text x="1615" y="203" text-anchor="middle" class="boxText">Barcode</text>

  <!-- layer 2 app -->
  <rect x="295" y="270" width="1465" height="250" rx="20" class="dash"/>
  <text x="1027" y="307" text-anchor="middle" class="section">Aplikasi Web Laravel</text>
  <rect x="355" y="335" width="315" height="135" rx="14" fill="#e5f8f5" class="stroke" filter="url(#shadow)"/>
  <text x="512" y="369" text-anchor="middle" class="boxTitle">UI StockGuard</text>
  <text x="512" y="396" text-anchor="middle" class="boxText">Blade · CSS · JavaScript</text>
  <text x="512" y="423" text-anchor="middle" class="boxText">Dashboard dan transaksi</text>
  <rect x="730" y="335" width="315" height="135" rx="14" fill="#e5f8f5" class="stroke" filter="url(#shadow)"/>
  <text x="887" y="369" text-anchor="middle" class="boxTitle">Auth &amp; Role</text>
  <text x="887" y="396" text-anchor="middle" class="boxText">Login dan pembatasan akses</text>
  <text x="887" y="423" text-anchor="middle" class="boxText">Staff · Supervisor · Admin</text>
  <rect x="1105" y="335" width="315" height="135" rx="14" fill="#e5f8f5" class="stroke" filter="url(#shadow)"/>
  <text x="1262" y="369" text-anchor="middle" class="boxTitle">Workflow Transaksi</text>
  <text x="1262" y="396" text-anchor="middle" class="boxText">Request → Scan → Checkpoint</text>
  <text x="1262" y="423" text-anchor="middle" class="boxText">Completed / Pending review</text>
  <rect x="1480" y="335" width="220" height="135" rx="14" fill="#e5f8f5" class="stroke" filter="url(#shadow)"/>
  <text x="1590" y="369" text-anchor="middle" class="boxTitle">Admin Panel</text>
  <text x="1590" y="396" text-anchor="middle" class="boxText">Produk &amp; stok</text>
  <text x="1590" y="423" text-anchor="middle" class="boxText">Gudang &amp; audit</text>

  <!-- layer 3 services -->
  <rect x="295" y="545" width="1465" height="205" rx="20" class="dash"/>
  <text x="1027" y="582" text-anchor="middle" class="section">Layanan Verifikasi dan Operasional</text>
  <rect x="355" y="612" width="300" height="96" rx="12" fill="#fff9e9" class="stroke"/>
  <text x="505" y="648" text-anchor="middle" class="boxTitle">Scan Service</text>
  <text x="505" y="675" text-anchor="middle" class="boxText">SKU / barcode matching</text>
  <rect x="700" y="612" width="300" height="96" rx="12" fill="#fff9e9" class="stroke"/>
  <text x="850" y="648" text-anchor="middle" class="boxTitle">WithdrawalWorkflow</text>
  <text x="850" y="675" text-anchor="middle" class="boxText">stok · anomaly · approval</text>
  <rect x="1045" y="612" width="300" height="96" rx="12" fill="#fff9e9" class="stroke"/>
  <text x="1195" y="648" text-anchor="middle" class="boxTitle">Vision Integration</text>
  <text x="1195" y="675" text-anchor="middle" class="boxText">jumlah · confidence · bukti</text>
  <rect x="1390" y="612" width="310" height="96" rx="12" fill="#fff9e9" class="stroke"/>
  <text x="1545" y="648" text-anchor="middle" class="boxTitle">Review &amp; Audit</text>
  <text x="1545" y="675" text-anchor="middle" class="boxText">Accept · reject · histori</text>

  <!-- layer 4 data -->
  <rect x="295" y="775" width="1465" height="210" rx="20" class="dash"/>
  <text x="1027" y="812" text-anchor="middle" class="section">Data dan Bukti</text>
  <rect x="355" y="845" width="560" height="95" rx="12" fill="#eef5ff" class="stroke"/>
  <text x="635" y="880" text-anchor="middle" class="boxTitle">MySQL · stockguard_ai</text>
  <text x="635" y="907" text-anchor="middle" class="boxText">users · products · transactions · scan_events</text>
  <text x="635" y="928" text-anchor="middle" class="boxText">vision_events · anomalies · stock · audit_logs</text>
  <rect x="975" y="845" width="330" height="95" rx="12" fill="#eef5ff" class="stroke"/>
  <text x="1140" y="880" text-anchor="middle" class="boxTitle">Private Storage</text>
  <text x="1140" y="907" text-anchor="middle" class="boxText">frame kamera dan evidence</text>
  <rect x="1365" y="845" width="335" height="95" rx="12" fill="#eef5ff" class="stroke"/>
  <text x="1532" y="880" text-anchor="middle" class="boxTitle">Demo Asset</text>
  <text x="1532" y="907" text-anchor="middle" class="boxText">4boxdetected.jpeg</text>

  <!-- layer 5 infra -->
  <rect x="295" y="1010" width="1465" height="220" rx="20" class="dash"/>
  <text x="1027" y="1047" text-anchor="middle" class="section">Infrastruktur dan Integrasi</text>
  <rect x="355" y="1080" width="280" height="92" rx="12" fill="#d9f8eb" class="stroke"/>
  <text x="495" y="1116" text-anchor="middle" class="boxTitle">PHP 8 + Laravel 9</text>
  <text x="495" y="1143" text-anchor="middle" class="boxText">Web server aplikasi</text>
  <rect x="700" y="1080" width="280" height="92" rx="12" fill="#d9f8eb" class="stroke"/>
  <text x="840" y="1116" text-anchor="middle" class="boxTitle">MySQL / XAMPP</text>
  <text x="840" y="1143" text-anchor="middle" class="boxText">database lokal</text>
  <rect x="1045" y="1080" width="280" height="92" rx="12" fill="#d9f8eb" class="stroke"/>
  <text x="1185" y="1116" text-anchor="middle" class="boxTitle">Exit Checkpoint Camera</text>
  <text x="1185" y="1143" text-anchor="middle" class="boxText">deteksi jumlah box</text>
  <rect x="1390" y="1080" width="310" height="92" rx="12" fill="#d9f8eb" class="stroke"/>
  <text x="1545" y="1116" text-anchor="middle" class="boxTitle">Vision Service / YOLO</text>
  <text x="1545" y="1143" text-anchor="middle" class="boxText">opsional; demo memakai static image</text>

  <!-- flow arrows -->
  <path d="M545 221 V335" class="line"/>
  <path d="M925 221 V335" class="line"/>
  <path d="M1320 221 V335" class="line"/>
  <path d="M512 470 V612" class="lineLight"/>
  <path d="M887 470 V612" class="lineLight"/>
  <path d="M1262 470 V612" class="lineLight"/>
  <path d="M1590 470 V612" class="lineLight"/>
  <path d="M505 708 V845" class="line"/>
  <path d="M850 708 V845" class="line"/>
  <path d="M1195 708 V845" class="line"/>
  <path d="M1545 708 V845" class="line"/>
  <path d="M635 940 V1080" class="line"/>
  <path d="M1140 940 V1080" class="line"/>
  <path d="M1532 940 V1080" class="line"/>
  <path d="M655 660 H700" class="lineLight"/>
  <path d="M1000 660 H1045" class="lineLight"/>
  <path d="M1345 660 H1390" class="lineLight"/>

  <!-- side connectors -->
  <path d="M261 180 H295" class="lineLight"/>
  <path d="M261 395 H295" class="lineLight"/>
  <path d="M261 645 H295" class="lineLight"/>
  <path d="M261 875 H295" class="lineLight"/>
  <path d="M261 1110 H295" class="lineLight"/>

  <!-- legend -->
  <rect x="1350" y="22" width="410" height="60" rx="12" fill="#f0f6f7" stroke="#d4e1e4"/>
  <circle cx="1380" cy="52" r="7" fill="#2bbec6"/><text x="1398" y="57" class="tiny">komponen aktif project</text>
  <circle cx="1560" cy="52" r="7" fill="#ff9b3d"/><text x="1578" y="57" class="tiny">demo / integrasi opsional</text>
</svg>
